services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    command: ["python", "-m", "app.worker"]
    volumes:
      - ../data:/app/data
    restart: unless-stopped
